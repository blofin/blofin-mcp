name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: the CI job only needs to read the repository. No write
# scopes, so a compromised third-party action or a malicious build script
# cannot modify releases, issues, or repository settings.
permissions:
  contents: read

# Cancel superseded runs for the same ref to avoid wasting runners, while
# still letting the latest commit finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
